spring.application.name=tausendfuessler-bot
# Der Bot ist reiner Client (Telegram-Long-Polling + REST zum Koordinator), kein eingebetteter Web-Server
spring.main.web-application-type=none

# Token/Username von @BotFather – ausschliesslich per Umgebungsvariable (siehe .env.example)
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:tausfler_bot}

coordinator.api.base-url=${COORDINATOR_BASE_URL:http://localhost:8080}
# Polling-Intervall des Live-Streams in ms (NFA: Ergebnis < 2 s beim Nutzer)
bot.poll-interval-ms=${BOT_POLL_INTERVAL_MS:1000}
