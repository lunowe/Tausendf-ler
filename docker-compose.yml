services:
  postgres:
    image: postgres:16-alpine
    container_name: tausendfuessler-db
    environment:
      POSTGRES_DB: tausendfuessler
      POSTGRES_USER: tausendfuessler
      POSTGRES_PASSWORD: tausendfuessler
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tausendfuessler"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
