spring:
  application:
    name: tausendfuessler-coordinator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tausendfuessler}
    username: ${DB_USER:tausendfuessler}
    password: ${DB_PASSWORD:tausendfuessler}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${COORDINATOR_PORT:8080}

tausendfuessler:
  worker-port: ${COORDINATOR_WORKER_PORT:9090}
  result-retention-days: ${RESULT_RETENTION_DAYS:30}

logging:
  file:
    name: ${LOG_FILE:logs/coordinator.log}
