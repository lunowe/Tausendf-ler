spring:
  application:
    name: tausendfuessler-coordinator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/tausendfuessler}
    username: ${DB_USER:tausendfuessler}
    password: ${DB_PASSWORD:tausendfuessler}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:${COORDINATOR_PORT:8080}}   # Railway injiziert PORT

tausendfuessler:
  worker-port: ${COORDINATOR_WORKER_PORT:9090}
  # Shared Secrets. Leer = keine Authentifizierung (lokale Entwicklung); wird beim Start als WARN geloggt.
  api-key: ${API_KEY:}            # Header X-Api-Key fuer /api/** (Bot, Frontend, Lasttest)
  worker-token: ${WORKER_TOKEN:}  # Feld token in REGISTER (Worker)
  # Erlaubte Origins des Browser-Frontends (frontend/), kommasepariert
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  result-retention-days: ${RESULT_RETENTION_DAYS:30}

logging:
  file:
    name: ${LOG_FILE:logs/coordinator.log}
